<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slevents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0620; --deep:#1a0b3a; --plum:#2e1065; --royal:#5b2bb0; --violet:#8b5cf6;
  --orchid:#b794f6; --lilac:#d9c8ff; --mist:#f1eaff;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--mist);font-family:var(--sans);-webkit-tap-highlight-color:transparent}

/* ================= STAGE ================= */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:70px 16px 24px;overflow:hidden;
  background:
   radial-gradient(ellipse 70% 50% at 50% 38%,#4c1d95aa 0%,transparent 70%),
   radial-gradient(ellipse at 50% 120%,#3b0f7a 0%,transparent 60%),
   linear-gradient(180deg,#0d0620 0%,#1d0d44 55%,#2a1160 100%)}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--lilac);opacity:.2;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.95;transform:scale(1.6)}}
.glitter{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--orchid);filter:blur(.5px);opacity:0;animation:rise linear infinite;pointer-events:none}
@keyframes rise{10%{opacity:.7}100%{opacity:0;transform:translateY(-70vh) translateX(var(--sx))}}

svg.scene{width:min(94vw,520px);height:auto;overflow:visible;position:relative;filter:drop-shadow(0 20px 40px #1a0b3acc)}

h1{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,8.4vw,3.3rem);line-height:1;text-align:center;letter-spacing:.01em;
  background:linear-gradient(180deg,var(--mist),var(--orchid) 80%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px #8b5cf655)}
h1 em{font-weight:500;font-style:italic}
.sub{font-weight:300;font-size:clamp(.85rem,3.4vw,1rem);color:var(--lilac);opacity:.75;text-align:center;letter-spacing:.02em}

/* progress */
.prog{width:min(64vw,220px);margin-top:6px;text-align:center}
.track{position:relative;height:5px;border-radius:5px;background:#ffffff1a;box-shadow:inset 0 1px 2px #0008,0 0 0 1px #ffffff12;overflow:hidden}
.fill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--royal),var(--violet),var(--lilac));transition:width 1s ease;position:relative}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff9 50%,transparent 70%);transform:translateX(-100%);animation:shim 2.2s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.pct{margin-top:7px;font-size:12px;font-weight:400;letter-spacing:.14em;color:var(--lilac);font-variant-numeric:tabular-nums}

/* ================= CURTAIN ================= */
.valance{position:fixed;top:0;left:0;right:0;height:46px;z-index:8;
  background:linear-gradient(180deg,#1a0b3a,#3b1580 70%,#4a1f9a);box-shadow:0 8px 24px #000a;transition:transform 1.4s 2.2s cubic-bezier(.6,0,.4,1)}
.valance::after{content:"";position:absolute;left:0;right:0;top:100%;height:30px;
  background:radial-gradient(circle at 36px 0,#4a1f9a 35px,transparent 36px) 0 0/72px 36px repeat-x;
  filter:drop-shadow(0 8px 8px #0009)}
.valance::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--lilac),transparent);opacity:.6}
.curtain{position:fixed;top:0;bottom:0;width:50.3%;z-index:6;
  background:
   linear-gradient(180deg,#ffffff1f 0%,transparent 22%,transparent 70%,#00000088 100%),
   repeating-linear-gradient(90deg,#12043088 0,#8b5cf633 12px,#0d062055 26px,#12043099 38px,#5b2bb044 52px,#12043088 64px),
   linear-gradient(90deg,#3b1580,#5b2bb0 45%,#3b1580);
  box-shadow:inset 0 -60px 80px #0007;
  transition:transform 3s cubic-bezier(.66,.02,.22,1)}
.curtain::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;
  background:repeating-linear-gradient(90deg,var(--lilac) 0 2px,transparent 2px 7px);opacity:.55;
  -webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
.curtain.l{left:0;transform-origin:left center;box-shadow:inset 0 -60px 80px #0007,12px 0 30px #000a}
.curtain.r{right:0;transform-origin:right center;box-shadow:inset 0 -60px 80px #0007,-12px 0 30px #000a}
.open .curtain{transform:scaleX(.07)}
.open .valance{transform:translateY(-120%)}

.welcome{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;transition:opacity .9s,transform 1.2s;outline:none}
.welcome .a{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(1.3rem,5.5vw,2rem);color:var(--lilac);letter-spacing:.04em}
.welcome .b{font-family:var(--serif);font-weight:700;font-size:clamp(3.4rem,17vw,8rem);line-height:.95;letter-spacing:.01em;margin:4px 0 14px;
  background:linear-gradient(180deg,#fff 0%,var(--lilac) 45%,var(--orchid) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px #000c) drop-shadow(0 0 28px #8b5cf688);animation:glow 3.5s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 6px 30px #000c) drop-shadow(0 0 46px #b794f6cc)}}
.orn{width:min(52vw,240px);height:1px;background:linear-gradient(90deg,transparent,var(--lilac),transparent);position:relative;margin-bottom:18px}
.orn::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;background:var(--lilac);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 14px var(--violet)}
.hint{font-weight:300;font-size:13px;letter-spacing:.2em;color:var(--lilac);opacity:.75;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.open .welcome{opacity:0;transform:scale(1.06);pointer-events:none}

/* ================= SCENE ANIMATION ================= */
.jib{transform-origin:350px 66px;animation:swing 7s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(3deg)}}
.hook{animation:lift 3.2s ease-in-out infinite alternate}
@keyframes lift{from{transform:translateY(0)}to{transform:translateY(40px)}}
.arm{transform-origin:82px 198px;animation:hammer .6s ease-in infinite}
@keyframes hammer{0%{transform:rotate(-78deg)}55%{transform:rotate(20deg)}100%{transform:rotate(-78deg)}}
.torso{animation:bob .6s ease-in infinite}
@keyframes bob{55%{transform:translateY(2px)}}
.spark{opacity:0;animation:spark .6s linear infinite}
@keyframes spark{0%,54%{opacity:0;transform:translate(0,0)}58%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.brick{opacity:0;transform:translateY(-22px);transition:opacity .4s,transform .4s cubic-bezier(.3,1.5,.5,1)}
.brick.on{opacity:1;transform:none}
.win{animation:win 3s ease-in-out infinite}
@keyframes win{50%{opacity:.45}}
.dust{opacity:0;animation:dust 2.6s ease-out infinite}
@keyframes dust{0%{opacity:.45;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(16px,-26px) scale(1.7)}}
.flag{transform-origin:left center;animation:flag 1s ease-in-out infinite alternate}
@keyframes flag{to{transform:skewY(9deg) scaleX(.88)}}
.beacon{animation:pulse 1.2s infinite}
@media (prefers-reduced-motion:reduce){.jib,.hook,.arm,.torso,.spark,.win,.dust,.flag,.beacon,.stars i,.glitter,.fill::after,.welcome .b,.hint{animation:none}}
</style>
</head>
<body>

<main class="stage">
  <div class="stars" id="stars"></div>

  <svg class="scene" viewBox="0 0 440 290" role="img" aria-label="Animated construction site">
    <defs>
      <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b1580"/><stop offset="1" stop-color="#1a0b3a"/></linearGradient>
      <linearGradient id="gMoon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1eaff"/><stop offset="1" stop-color="#b794f6"/></linearGradient>
      <radialGradient id="gHalo"><stop offset="0" stop-color="#b794f6" stop-opacity=".55"/><stop offset="1" stop-color="#b794f6" stop-opacity="0"/></radialGradient>
      <pattern id="hz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#b794f6"/><rect x="8" width="8" height="16" fill="#2e1065"/></pattern>
    </defs>

    <!-- moon + skyline -->
    <circle cx="62" cy="52" r="46" fill="url(#gHalo)"/>
    <circle cx="62" cy="52" r="17" fill="url(#gMoon)"/>
    <g fill="#2e1065" opacity=".85">
      <rect x="0" y="196" width="26" height="70"/><rect x="30" y="170" width="22" height="96"/><rect x="56" y="206" width="30" height="60"/>
      <rect x="305" y="190" width="24" height="76"/><rect x="392" y="180" width="26" height="86"/><rect x="420" y="208" width="20" height="58"/>
    </g>
    <g fill="#d9c8ff" opacity=".5"><rect x="36" y="180" width="3" height="3"/><rect x="42" y="192" width="3" height="3"/><rect x="398" y="192" width="3" height="3"/><rect x="408" y="204" width="3" height="3"/><rect x="312" y="202" width="3" height="3"/></g>

    <!-- ground -->
    <rect x="0" y="262" width="440" height="28" fill="url(#gGround)"/>
    <rect x="0" y="262" width="440" height="5" fill="url(#hz)" opacity=".85"/>

    <!-- crane tower -->
    <g stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <path d="M340 262V66M360 262V66M340 262L360 240L340 218L360 196L340 174L360 152L340 130L360 108L340 86L360 66"/>
    </g>
    <rect x="334" y="258" width="32" height="6" rx="2" fill="#5b2bb0"/>

    <!-- crane jib + hook -->
    <g class="jib">
      <rect x="168" y="60" width="226" height="8" rx="2" fill="#a47af7"/>
      <path d="M168 68L214 60M214 60L260 68L306 60L350 68" stroke="#d9c8ff" stroke-width="1.2" fill="none" opacity=".7"/>
      <path d="M350 30L350 60M350 30L172 60M350 30L388 60" stroke="#b794f6" stroke-width="1.5" fill="none"/>
      <rect x="368" y="56" width="26" height="22" rx="3" fill="#5b2bb0"/>
      <rect x="338" y="52" width="26" height="18" rx="3" fill="#7c3aed"/>
      <circle cx="350" cy="28" r="3.5" class="beacon" fill="#f1eaff"/>
      <line x1="214" y1="68" x2="214" y2="94" stroke="#d9c8ff" stroke-width="1.5"/>
      <g class="hook">
        <line x1="214" y1="94" x2="214" y2="122" stroke="#d9c8ff" stroke-width="1.5"/>
        <path d="M214 122L194 136M214 122L234 136" stroke="#d9c8ff" stroke-width="1.2"/>
        <rect x="190" y="136" width="48" height="8" rx="2" fill="#4c1d95"/>
        <rect x="194" y="126" width="18" height="10" rx="2" fill="#8b5cf6"/><rect x="214" y="126" width="18" height="10" rx="2" fill="#a47af7"/>
      </g>
    </g>

    <!-- scaffold -->
    <g stroke="#b794f6" stroke-width="1.4" opacity=".5" fill="none">
      <path d="M168 262V112M292 262V112M168 150H292M168 198H292M168 112H292M168 262L292 198M168 198L292 150"/>
    </g>

    <!-- building bricks -->
    <g id="bricks"></g>
    <path d="M180 262V118H284V262" fill="none" stroke="#ffffff1c" stroke-dasharray="3 5"/>
    <line x1="232" y1="118" x2="232" y2="88" stroke="#d9c8ff" stroke-width="2"/>
    <path class="flag" d="M232 88h26l-6 7 6 7h-26z" fill="#a47af7"/>

    <!-- workbench + plank -->
    <rect x="98" y="214" width="62" height="6" rx="2" fill="#7c3aed"/>
    <rect x="104" y="220" width="5" height="42" fill="#4c1d95"/><rect x="149" y="220" width="5" height="42" fill="#4c1d95"/>
    <rect x="106" y="208" width="44" height="6" rx="1.5" fill="#b794f6"/>

    <!-- worker -->
    <g>
      <g class="torso">
        <rect x="68" y="214" width="8" height="48" rx="3" fill="#2e1065"/><rect x="78" y="214" width="8" height="48" rx="3" fill="#3b1580"/>
        <rect x="64" y="188" width="26" height="32" rx="7" fill="#7c3aed"/>
        <rect x="64" y="204" width="26" height="4" fill="#d9c8ff" opacity=".75"/>
        <circle cx="77" cy="177" r="9" fill="#e6d9ff"/>
        <path d="M66 176a11 11 0 0122 0z" fill="#d9c8ff"/><rect x="63" y="175" width="28" height="3.5" rx="1.7" fill="#b794f6"/>
      </g>
      <g class="arm">
        <rect x="80" y="195" width="30" height="6" rx="3" fill="#e6d9ff"/>
        <rect x="106" y="184" width="5" height="28" rx="2" fill="#a47af7"/>
        <rect x="99" y="180" width="19" height="10" rx="2.5" fill="#f1eaff"/>
      </g>
      <circle class="spark" cx="112" cy="206" r="2.2" fill="#f1eaff" style="--dx:-16px;--dy:-18px"/>
      <circle class="spark" cx="112" cy="206" r="2" fill="#d9c8ff" style="--dx:14px;--dy:-22px"/>
      <circle class="spark" cx="112" cy="206" r="1.7" fill="#b794f6" style="--dx:2px;--dy:-26px"/>
      <circle class="spark" cx="112" cy="206" r="1.5" fill="#fff" style="--dx:22px;--dy:-10px"/>
    </g>

    <circle class="dust" cx="250" cy="258" r="7" fill="#d9c8ff"/>
    <circle class="dust" cx="200" cy="258" r="6" fill="#d9c8ff" style="animation-delay:1.2s"/>
    <path d="M312 262l7-20 7 20z" fill="#a47af7"/><rect x="314" y="252" width="10" height="3" fill="#2e1065"/>
    <path d="M396 262l6-16 6 16z" fill="#a47af7"/><rect x="398" y="254" width="8" height="3" fill="#2e1065"/>
  </svg>

  <h1><em>Monpress</em> is at work</h1>
  <p class="sub">Something beautiful is being built for Slevents.</p>

  <div class="prog" role="progressbar" aria-label="Build progress" aria-valuemin="0" aria-valuemax="100">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="pct" id="pct">0%</div>
  </div>
</main>

<div class="curtain l"></div>
<div class="curtain r"></div>
<div class="valance"></div>
<div class="welcome" id="welcome" role="button" tabindex="0" aria-label="Open the curtain">
  <span class="a">Welcome to</span>
  <span class="b">Slevents</span>
  <span class="orn"></span>
  <span class="hint">TAP TO OPEN</span>
</div>

<script>
/* Curtain: tap / Enter, or opens by itself after 4.5s */
const welcome = document.getElementById('welcome');
const openCurtain = () => document.body.classList.add('open');
welcome.addEventListener('click', openCurtain);
welcome.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCurtain(); } });
setTimeout(openCurtain, 4500);

/* Stars + rising glitter */
const stars = document.getElementById('stars'), stage = document.querySelector('.stage');
for (let i = 0; i < 46; i++) {
  const s = document.createElement('i');
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*60}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
  stars.appendChild(s);
}
for (let i = 0; i < 16; i++) {
  const g = document.createElement('span');
  g.className = 'glitter';
  g.style.cssText = `left:${Math.random()*100}%;--sx:${(Math.random()*60-30)|0}px;animation-duration:${8+Math.random()*8}s;animation-delay:${Math.random()*10}s`;
  stage.appendChild(g);
}

/* Building: bricks drop in one by one, window bricks glow, then the wall resets */
const NS = 'http://www.w3.org/2000/svg', wall = document.getElementById('bricks');
const bricks = [], rows = 9, cols = 5, bw = 20.8, bh = 16;
const shades = ['#6d3fd1', '#5b2bb0', '#7f52e3', '#4a2290'];
for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {
    const half = r % 2 === 1;
    const x = 180 + c * bw - (half ? bw / 2 : 0);
    const w = half && (c === 0) ? bw / 2 : bw;
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', half && c === 0 ? 180 : x);
    rect.setAttribute('y', 262 - (r + 1) * bh);
    rect.setAttribute('width', w - 1.5);
    rect.setAttribute('height', bh - 1.5);
    rect.setAttribute('rx', 2);
    const isWin = r > 1 && r % 2 === 0 && c % 2 === 1 && !half;
    rect.setAttribute('fill', isWin ? '#e9dcff' : shades[(r * 3 + c) % 4]);
    rect.setAttribute('class', 'brick' + (isWin ? ' win' : ''));
    if (isWin) rect.style.animationDelay = (Math.random() * 2) + 's';
    wall.appendChild(rect); bricks.push(rect);
  }
}
let n = 0;
setInterval(() => {
  if (n < bricks.length) bricks[n++].classList.add('on');
  else if (++n > bricks.length + 16) { bricks.forEach(b => b.classList.remove('on')); n = 0; }
}, 150);

/* Progress: counts up to 100% by the launch time. Change START to reset. */
const START = new Date('2026-10-27T12:00:00+01:00').getTime();   // Lagos time
const TOTAL = 48 * 60 * 60 * 1000;
const fill = document.getElementById('fill'), pct = document.getElementById('pct'), bar = document.querySelector('.prog');
function tick() {
  const p = Math.min(100, Math.max(0, (Date.now() - START) / TOTAL * 100));
  fill.style.width = p + '%';
  pct.textContent = p >= 100 ? 'LAUNCHING NOW' : p.toFixed(1) + '%';
  bar.setAttribute('aria-valuenow', Math.round(p));
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
